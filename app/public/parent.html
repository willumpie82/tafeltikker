<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tafeltikker — Ouderportaal</title>
    <link rel="stylesheet" href="/parent.css" />
  </head>
  <body>
    <main id="parent-app">
      <section id="parent-view-login" class="parent-view">
        <h1>Ouderportaal</h1>
        <form id="login-form">
          <label>
            Gebruikersnaam
            <input type="text" id="login-username" autocomplete="username" required />
          </label>
          <label>
            Wachtwoord
            <input type="password" id="login-password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="error-text" hidden>Onjuiste gebruikersnaam of wachtwoord.</p>
          <button type="submit">Inloggen</button>
        </form>
        <a href="/">&larr; Terug naar Tafeltikker</a>
        <p class="version-tag">Tafeltikker · beta v0.1</p>
      </section>

      <section id="parent-view-dashboard" class="parent-view" hidden>
        <header class="dashboard-header">
          <h1>Ouderportaal</h1>
          <div class="header-actions">
            <span id="logged-in-as" class="logged-in-as"></span>
            <a href="/admin.html" id="admin-link" hidden>Beheer</a>
            <button type="button" id="logout-button">Uitloggen</button>
          </div>
        </header>

        <button type="button" id="add-child-button">+ Kind toevoegen</button>

        <form id="add-child-form" class="child-form" hidden>
          <h2>Nieuw kind</h2>
          <label>
            Naam
            <input type="text" id="new-child-name" required />
          </label>
          <label>
            Avatar
            <div id="new-child-avatar-picker" class="avatar-picker"></div>
          </label>
          <label>
            Geheime code (4 cijfers)
            <input type="text" id="new-child-pin" inputmode="numeric" pattern="\d{4}" maxlength="4" required />
          </label>
          <div class="form-actions">
            <button type="submit">Opslaan</button>
            <button type="button" id="cancel-add-child">Annuleren</button>
          </div>
          <p id="add-child-error" class="error-text" hidden></p>
        </form>

        <div id="children-list" class="children-list"></div>

        <section class="feedback-section">
          <h2>Feedback voor de ontwikkelaar</h2>
          <form id="feedback-form">
            <textarea id="feedback-message" rows="3" placeholder="Bug, idee, opmerking..." required></textarea>
            <div class="form-actions">
              <button type="submit">Versturen</button>
            </div>
            <p id="feedback-error" class="error-text" hidden></p>
          </form>
          <div id="feedback-list" class="feedback-list"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/parent.js"></script>
  </body>
</html>
