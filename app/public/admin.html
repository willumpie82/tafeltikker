<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tafeltikker — Beheer</title>
    <link rel="stylesheet" href="/parent.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main id="admin-app" hidden>
      <header class="dashboard-header">
        <h1>Beheer</h1>
        <div class="header-actions">
          <span id="logged-in-as" class="logged-in-as"></span>
          <a href="/parent.html">&larr; Dashboard</a>
          <button type="button" id="admin-logout-button">Uitloggen</button>
        </div>
      </header>

      <nav class="admin-tabs">
        <button type="button" class="tab-button selected" data-tab="parents">Ouders</button>
        <button type="button" class="tab-button" data-tab="children">Kinderen</button>
        <button type="button" class="tab-button" data-tab="feedback">Feedback</button>
        <button type="button" class="tab-button" data-tab="invites">Uitnodigingen</button>
      </nav>

      <section id="admin-tab-parents" class="admin-tab">
        <button type="button" id="quick-invite-button">+ Ouder uitnodigen</button>
        <div id="quick-invite-result" class="invite-result" hidden>
          <p>Deel deze link met de nieuwe ouder:</p>
          <input type="text" id="quick-invite-url" readonly />
        </div>
        <div id="parents-list" class="admin-list"></div>
      </section>

      <section id="admin-tab-children" class="admin-tab" hidden>
        <button type="button" id="admin-add-child-button">+ Kind toevoegen</button>

        <form id="admin-add-child-form" class="child-form" hidden>
          <h2>Nieuw kind</h2>
          <label>
            Naam
            <input type="text" id="admin-new-child-name" required />
          </label>
          <label>
            Avatar
            <div id="admin-new-child-avatar-picker" class="avatar-picker"></div>
          </label>
          <label>
            Geheime code (4 cijfers)
            <input type="text" id="admin-new-child-pin" inputmode="numeric" pattern="\d{4}" maxlength="4" required />
          </label>
          <label>
            Ouder(s)
            <div id="admin-new-child-parents" class="parent-checkboxes"></div>
          </label>
          <div class="form-actions">
            <button type="submit">Opslaan</button>
            <button type="button" id="admin-cancel-add-child">Annuleren</button>
          </div>
          <p id="admin-add-child-error" class="error-text" hidden></p>
        </form>

        <div id="admin-children-list" class="admin-list"></div>
      </section>

      <section id="admin-tab-feedback" class="admin-tab" hidden>
        <form id="admin-feedback-form">
          <textarea id="admin-feedback-message" rows="3" placeholder="Eigen bug, idee, opmerking..." required></textarea>
          <div class="form-actions">
            <button type="submit">Versturen</button>
          </div>
          <p id="admin-feedback-error" class="error-text" hidden></p>
        </form>
        <div id="admin-feedback-list" class="feedback-list"></div>
      </section>

      <section id="admin-tab-invites" class="admin-tab" hidden>
        <form id="invite-form" class="invite-form">
          <label>
            Geldig (dagen)
            <input type="number" id="invite-days" min="1" value="7" />
          </label>
          <button type="submit">Genereer uitnodiging</button>
        </form>
        <div id="invite-result" class="invite-result" hidden>
          <p>Deel deze link met de nieuwe ouder:</p>
          <input type="text" id="invite-url" readonly />
        </div>
        <div id="invites-list" class="admin-list"></div>
      </section>
    </main>

    <p id="admin-denied" class="version-tag" hidden>Je hebt geen toegang tot deze pagina.</p>

    <script type="module" src="/admin.js"></script>
  </body>
</html>
